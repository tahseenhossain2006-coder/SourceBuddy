use_default_settings: true

general:
  instance_name: "SourceAI SearXNG"
  debug: false
  enable_metrics: false

server:
  base_url: "http://localhost:8080/"
  secret_key: "change_me_in_production"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: false

# Only JSON-friendly engines. No engines requiring paid keys.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false